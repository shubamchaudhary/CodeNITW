<text x="208.0" y="164.64" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14.5" fill="#eef2f8" text-anchor="middle" font-weight="650">Dairy</text>
<rect x="280" y="140" width="116" height="40" rx="10" fill="#1a2235" stroke="#2f3a55" stroke-width="1.2"/>
<text x="338.0" y="164.64" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14.5" fill="#eef2f8" text-anchor="middle" font-weight="650">Bakery</text>
<text x="30" y="252" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="600">class</text>
<path d="M208 180 L208 202 L208 202 L208 226" fill="none" stroke="#5b9cff" stroke-width="2"/>
