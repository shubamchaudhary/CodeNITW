<text x="490" y="264" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eef2f8" text-anchor="middle" font-weight="700">JwtAuthenticationConverter</text>
<text x="490" y="286" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">scope -&gt; SCOPE_orders:read</text>
<line x1="490" y1="304" x2="490" y2="336" stroke="#93a0b8" stroke-width="2.5" marker-end="url(#am)"/>
<rect x="340" y="338" width="300" height="56" rx="10" fill="#1a2235" stroke="#3fd2e8" stroke-width="2"/>
<text x="490" y="371" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="middle" font-weight="700">SecurityContextHolder</text>
<line x1="490" y1="396" x2="490" y2="428" stroke="#93a0b8" stroke-width="2.5" marker-end="url(#am)"/>
<rect x="340" y="430" width="300" height="56" rx="10" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/>
<text x="490" y="463" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="middle" font-weight="700">AuthorizationFilter</text>
