<text x="800" y="222" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="11" fill="#93a0b8" text-anchor="middle" font-weight="400">/.well-known/jwks.json</text>
<line x1="800" y1="178" x2="800" y2="148" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ap)"/>
<line x1="700" y1="146" x2="520" y2="236" stroke="#38d996" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="560" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#38d996" text-anchor="start" font-weight="400">valid</text>
