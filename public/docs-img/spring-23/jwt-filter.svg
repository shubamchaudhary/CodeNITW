<text x="490" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eef2f8" text-anchor="middle" font-weight="700">BearerTokenAuthenticationFilter</text>
<text x="490" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">reads the header</text>
