<text x="860" y="384" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">invalid_token</text>
<text x="948" y="260" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ff6262" text-anchor="start" font-weight="400">bad</text>
<line x1="642" y1="458" x2="758" y2="458" stroke="#ffb547" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="760" y="430" width="200" height="56" rx="10" fill="#2a2214" stroke="#ffb547" stroke-width="2"/>
<text x="860" y="456" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#ffb547" text-anchor="middle" font-weight="700">403</text>
<text x="860" y="476" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">valid, wrong role</text>
<line x1="490" y1="488" x2="490" y2="518" stroke="#93a0b8" stroke-width="2.5" marker-end="url(#am)"/>
<rect x="340" y="520" width="300" height="50" rx="10" fill="#1a2235" stroke="#38d996" stroke-width="2"/>
<text x="490" y="551" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="middle" font-weight="700">controller</text>
<text x="40" y="210" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffb547" text-anchor="start" font-weight="600">no header?</text>
<text x="40" y="232" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">continue as anonymous;</text>
<text x="40" y="252" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">protected URL -&gt; 401</text>
