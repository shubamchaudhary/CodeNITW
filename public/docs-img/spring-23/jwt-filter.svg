<rect x="680" y="80" width="260" height="64" rx="10" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/>
<text x="810" y="106" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="middle" font-weight="700">JwtDecoder (Nimbus)</text>
<text x="810" y="128" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">signature, exp, nbf, iss</text>
