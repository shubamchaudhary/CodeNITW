<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 675" width="980" height="675" role="img" aria-label="OAuth authorization code with PKCE">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a0b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d996"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6262"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9cff"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb547"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
<rect width="980" height="675" rx="18" fill="#0f1420"/>
<text x="40" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#eef2f8" text-anchor="start" font-weight="700">Authorization code flow with PKCE</text>
<rect x="40" y="70" width="180" height="64" rx="10" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/><text x="130.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">Browser</text><text x="130.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">the user</text>
<rect x="290" y="70" width="180" height="64" rx="10" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/><text x="380.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">Client app</text><text x="380.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">printer.example</text>
<rect x="560" y="70" width="180" height="64" rx="10" fill="#1a2235" stroke="#ffb547" stroke-width="2"/><text x="650.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">Auth server</text><text x="650.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">login + tokens</text>
<rect x="800" y="70" width="160" height="64" rx="10" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="880.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">Resource server</text><text x="880.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">Photos API</text>
<line x1="130" y1="134" x2="130" y2="640" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="380" y1="134" x2="380" y2="640" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="650" y1="134" x2="650" y2="640" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="880" y1="134" x2="880" y2="640" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<text x="380" y="160" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">makes code_verifier + code_challenge = SHA256(verifier)</text>
<line x1="380" y1="195" x2="130" y2="195" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><text x="255.0" y="186" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="400">redirect to /authorize</text><circle cx="114" cy="195" r="11" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/><text x="114" y="200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="700">1</text>
<line x1="130" y1="240" x2="650" y2="240" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><text x="390.0" y="231" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="400">GET /authorize?code_challenge=..&amp;state=xyz</text>
<line x1="130" y1="290" x2="650" y2="290" stroke="#5b9cff" stroke-width="2.5" marker-end="url(#ab)"/><text x="390.0" y="281" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#5b9cff" text-anchor="middle" font-weight="400">user logs in, approves photos.read</text><circle cx="114" cy="290" r="11" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/><text x="114" y="295" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b9cff" text-anchor="middle" font-weight="700">2</text>
<line x1="650" y1="340" x2="130" y2="340" stroke="#ffb547" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#aa)"/><text x="390.0" y="331" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#ffb547" text-anchor="middle" font-weight="400">302 /cb?code=SplxlO&amp;state=xyz</text><circle cx="114" cy="340" r="11" fill="#1a2235" stroke="#ffb547" stroke-width="2"/><text x="114" y="345" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffb547" text-anchor="middle" font-weight="700">3</text>
<line x1="130" y1="380" x2="380" y2="380" stroke="#ffb547" stroke-width="2.5" marker-end="url(#aa)"/><text x="255.0" y="371" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffb547" text-anchor="middle" font-weight="400">code reaches the client; it checks state</text>
<line x1="380" y1="430" x2="650" y2="430" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ap)"/><text x="515.0" y="421" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#a78bfa" text-anchor="middle" font-weight="400">POST /token  code + code_verifier</text><circle cx="364" cy="430" r="11" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/><text x="364" y="435" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#a78bfa" text-anchor="middle" font-weight="700">4</text>
<text x="515" y="452" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">back channel: not through the browser</text>
<line x1="650" y1="492" x2="380" y2="492" stroke="#38d996" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ag)"/><text x="515.0" y="483" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#38d996" text-anchor="middle" font-weight="400">access token (+ refresh token)</text><circle cx="364" cy="492" r="11" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="364" y="497" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#38d996" text-anchor="middle" font-weight="700">5</text>
<line x1="380" y1="545" x2="880" y2="545" stroke="#38d996" stroke-width="2.5" marker-end="url(#ag)"/><text x="630.0" y="536" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#38d996" text-anchor="middle" font-weight="400">GET /photos  Authorization: Bearer ...</text><circle cx="364" cy="545" r="11" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="364" y="550" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#38d996" text-anchor="middle" font-weight="700">6</text>
<rect x="40" y="580" width="900" height="70" rx="10" fill="#1a2235" stroke="#2f3a55" stroke-width="2"/>
<text x="60" y="608" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eef2f8" text-anchor="start" font-weight="400">A stolen code is useless without the code_verifier (PKCE). state stops CSRF on the callback.</text>
<text x="60" y="632" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#93a0b8" text-anchor="start" font-weight="400">Implicit and password grants are deprecated (RFC 9700): use this flow for every app with a user.</text>
</svg>
