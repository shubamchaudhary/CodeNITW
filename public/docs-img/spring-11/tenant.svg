<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 585" width="980" height="585" role="img" aria-label="Tenant resolution filter">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a0b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d996"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6262"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9cff"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb547"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
<rect width="980" height="585" rx="18" fill="#0f1420"/>
<text x="40" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#eef2f8" text-anchor="start" font-weight="700">Tenant resolution: a filter right after authentication</text>
<rect x="40" y="80" width="440" height="332" rx="10" fill="#121a2a" stroke="#2f3a55" stroke-width="2"/>
<text x="56" y="102" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#93a0b8" text-anchor="start" font-weight="600">security filter chain</text>
<rect x="56" y="114" width="408" height="40" rx="8" fill="#1a2235" stroke="#3fd2e8" stroke-width="2"/>
<text x="72" y="140" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="500">CorsFilter</text>
<rect x="56" y="164" width="408" height="40" rx="8" fill="#1a2235" stroke="#93a0b8" stroke-width="2"/>
<text x="72" y="190" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="500">CsrfFilter (off for APIs)</text>
<rect x="56" y="214" width="408" height="40" rx="8" fill="#1a2235" stroke="#38d996" stroke-width="2"/>
<text x="72" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="500">BearerTokenAuthenticationFilter</text>
<rect x="56" y="264" width="408" height="40" rx="8" fill="#2a2214" stroke="#ffb547" stroke-width="2"/>
<text x="72" y="290" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="700">TenantFilter</text>
<rect x="56" y="314" width="408" height="40" rx="8" fill="#1a2235" stroke="#ff6262" stroke-width="2"/>
<text x="72" y="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="500">ExceptionTranslationFilter</text>
<rect x="56" y="364" width="408" height="40" rx="8" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/>
<text x="72" y="390" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="500">AuthorizationFilter</text>
<line x1="482" y1="289" x2="538" y2="289" stroke="#ffb547" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="540" y="230" width="400" height="118" rx="10" fill="#1a2235" stroke="#ffb547" stroke-width="2"/>
<text x="556" y="256" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#ffb547" text-anchor="start" font-weight="700">TenantFilter</text>
<text x="556" y="280" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13" fill="#eef2f8" text-anchor="start" font-weight="400">tenant = jwt claim tenant_id</text>
<text x="556" y="302" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13" fill="#eef2f8" text-anchor="start" font-weight="400">X-Tenant-ID must match, else 403</text>
<text x="556" y="324" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13" fill="#eef2f8" text-anchor="start" font-weight="400">TenantContext.set(tenant); MDC</text>
<line x1="740" y1="350" x2="740" y2="396" stroke="#ffb547" stroke-width="2.5" marker-end="url(#aa)"/>
<rect x="540" y="398" width="400" height="70" rx="10" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/>
<text x="556" y="424" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eef2f8" text-anchor="start" font-weight="400">repositories / Hibernate read</text>
<text x="556" y="448" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">TenantContext -&gt; WHERE tenant_id = ?</text>
<rect x="540" y="488" width="400" height="70" rx="10" fill="#2a1418" stroke="#ff6262" stroke-width="2"/>
<text x="556" y="514" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#ff6262" text-anchor="start" font-weight="400">finally { TenantContext.clear(); }</text>
<text x="556" y="538" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">threads are reused: no leak to the next tenant</text>
<text x="40" y="430" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffb547" text-anchor="start" font-weight="600">after authentication:</text>
<text x="40" y="452" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">the tenant comes from a</text>
<text x="40" y="472" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">signed claim, not a header</text>
<text x="40" y="504" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">@Async / Kafka: copy it with</text>
<text x="40" y="524" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="start" font-weight="400">a TaskDecorator or a header</text>
</svg>
