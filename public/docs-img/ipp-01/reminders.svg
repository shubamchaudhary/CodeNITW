<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" width="1240" height="640" role="img" aria-label="Contest reminders: idempotent by construction">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a0b8"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9cff"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d996"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb547"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6fa5"/></marker><marker id="au" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fd2e8"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6262"/></marker></defs>
<rect width="1240" height="640" rx="18" fill="#0f1420"/>
<text x="36" y="48" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#eef2f8" text-anchor="start" font-weight="700">Contest reminders: idempotent by construction</text>
<text x="36" y="76" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="15" fill="#93a0b8" text-anchor="start" font-weight="400">overlapping or repeated runs never email anyone twice; a failed send is retried by the next run</text>
<rect x="30" y="120" width="220" height="84" rx="10" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/>
<text x="140.0" y="147.57" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#eef2f8" text-anchor="middle" font-weight="650">Vercel Cron</text>
<text x="140.0" y="167.27499999999998" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">96 daily jobs</text>
<text x="140.0" y="184.825" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">~ every 15 min</text>
<rect x="30" y="220" width="220" height="70" rx="10" fill="#1a2235" stroke="#2f3a55" stroke-width="1.2"/>
<text x="140.0" y="249.345" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#eef2f8" text-anchor="middle" font-weight="650">GitHub Actions</text>
<text x="140.0" y="269.05" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">backup, every 10 min</text>
<rect x="310" y="160" width="230" height="92" rx="10" fill="#1a2235" stroke="#a78bfa" stroke-width="2"/>
<text x="425.0" y="191.25" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="15" fill="#eef2f8" text-anchor="middle" font-weight="650">/api/contest-reminders</text>
<text x="425.0" y="210.77499999999998" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">Authorization:</text>
<text x="425.0" y="228.325" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">Bearer CRON_SECRET</text>
<path d="M250 162 L308 190" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#au)"/>
<path d="M250 255 L308 225" fill="none" stroke="#93a0b8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#am)"/>
<rect x="600" y="120" width="280" height="84" rx="10" fill="#1a2235" stroke="#ffb547" stroke-width="2"/>
<text x="740.0" y="147.57" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#eef2f8" text-anchor="middle" font-weight="650">getContests()</text>
<text x="740.0" y="167.27499999999998" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">the shared 10-min cache: a</text>
<text x="740.0" y="184.825" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">platform that&#x27;s down still counts</text>
<rect x="600" y="225" width="280" height="92" rx="10" fill="#1a2235" stroke="#ffb547" stroke-width="2"/>
<text x="740.0" y="256.57" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#eef2f8" text-anchor="middle" font-weight="650">dueReminders(now)</text>
<text x="740.0" y="276.275" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">day: &lt;= 24h05m and &gt; 3h before</text>
<text x="740.0" y="293.825" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">hour: &lt;= 65 min and &gt; 2 min before</text>
<rect x="940" y="120" width="270" height="84" rx="10" fill="#1a2235" stroke="#2f3a55" stroke-width="1.2"/>
<text x="1075.0" y="147.57" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#eef2f8" text-anchor="middle" font-weight="650">confirmed subscribers</text>
<text x="1075.0" y="167.27499999999998" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">contestSubscribers</text>
<text x="1075.0" y="184.825" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">where confirmed == true</text>
<path d="M540 190 L598 165" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#aa)"/>
<path d="M740 204 L740 223" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#aa)"/>
<path d="M880 162 L938 162" fill="none" stroke="#93a0b8" stroke-width="2" marker-end="url(#am)"/>
<rect x="310" y="360" width="400" height="120" rx="10" fill="#1a2235" stroke="#38d996" stroke-width="2"/>
<text x="510.0" y="397.115" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="650">claim(reminder, people)</text>
<text x="510.0" y="417.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">Firestore transaction on contestReminders/{key}:</text>
<text x="510.0" y="434.55" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">read sentTo, keep people not in it,</text>
<text x="510.0" y="452.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">write them in BEFORE any email is sent</text>
<path d="M740 317 L740 340 L510 340 L510 358" fill="none" stroke="#38d996" stroke-width="2" marker-end="url(#ag)"/>
<rect x="770" y="360" width="440" height="120" rx="10" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/>
<text x="990.0" y="397.115" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="650">one email per person per run</text>
<text x="990.0" y="417.0" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">all their due reminders together, in their time zone;</text>
<text x="990.0" y="434.55" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">Gmail SMTP, pooled connection; List-Unsubscribe</text>
<text x="990.0" y="452.1" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">one-click (RFC 8058)</text>
<path d="M710 420 L768 420" fill="none" stroke="#5b9cff" stroke-width="2" marker-end="url(#ab)"/>
<rect x="770" y="510" width="440" height="100" rx="10" fill="#1a2235" stroke="#ff6262" stroke-width="2"/>
<text x="990.0" y="545.8900000000001" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="650">send failed?</text>
<text x="990.0" y="565.7750000000001" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">release: delete sentTo.{uid} for those reminders,</text>
<text x="990.0" y="583.325" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">so the next run claims and sends them again</text>
<path d="M990 480 L990 508" fill="none" stroke="#ff6262" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="510" width="680" height="100" rx="10" fill="#1a2235" stroke="#2f3a55" stroke-width="1.2"/>
<text x="370.0" y="545.8900000000001" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="650">Why it&#x27;s safe to run too often</text>
<text x="370.0" y="565.7750000000001" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">the key is contest id + start time + kind: a rescheduled contest is reminded again;</text>
<text x="370.0" y="583.325" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#93a0b8" text-anchor="middle" font-weight="400">a late subscriber still gets a reminder that is still due; dryRun and test modes send nothing real</text>
</svg>
