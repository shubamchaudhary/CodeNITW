<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 545" width="980" height="545" role="img" aria-label="CORS preflight">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a0b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d996"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6262"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9cff"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb547"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
<rect width="980" height="545" rx="18" fill="#0f1420"/>
<text x="40" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#eef2f8" text-anchor="start" font-weight="700">CORS preflight: the browser asks first</text>
<rect x="80" y="70" width="220" height="64" rx="10" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/><text x="190.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">Browser</text><text x="190.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">page from app.example</text>
<rect x="640" y="70" width="260" height="64" rx="10" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="770.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">api.example</text><text x="770.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">Spring CorsFilter</text>
<line x1="190" y1="134" x2="190" y2="470" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="770" y1="134" x2="770" y2="470" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="190" y1="185" x2="770" y2="185" stroke="#ffb547" stroke-width="2.5" marker-end="url(#aa)"/><text x="480.0" y="176" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#ffb547" text-anchor="middle" font-weight="400">OPTIONS /orders</text><circle cx="174" cy="185" r="11" fill="#1a2235" stroke="#ffb547" stroke-width="2"/><text x="174" y="190" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ffb547" text-anchor="middle" font-weight="700">1</text>
<text x="480" y="212" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">Origin: https://app.example   Request-Method: PUT</text>
<text x="480" y="230" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">Access-Control-Request-Headers: authorization</text>
<line x1="770" y1="275" x2="190" y2="275" stroke="#38d996" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ag)"/><text x="480.0" y="266" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#38d996" text-anchor="middle" font-weight="400">204  Allow-Origin: https://app.example</text><circle cx="174" cy="275" r="11" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="174" y="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#38d996" text-anchor="middle" font-weight="700">2</text>
<text x="480" y="302" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="12" fill="#93a0b8" text-anchor="middle" font-weight="400">Allow-Methods: GET, POST, PUT   Allow-Headers: Authorization</text>
<line x1="190" y1="350" x2="770" y2="350" stroke="#5b9cff" stroke-width="2.5" marker-end="url(#ab)"/><text x="480.0" y="341" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#5b9cff" text-anchor="middle" font-weight="400">PUT /orders   Authorization: Bearer ...</text><circle cx="174" cy="350" r="11" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/><text x="174" y="355" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5b9cff" text-anchor="middle" font-weight="700">3</text>
<line x1="770" y1="400" x2="190" y2="400" stroke="#38d996" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ag)"/><text x="480.0" y="391" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#38d996" text-anchor="middle" font-weight="400">200 + Allow-Origin: browser lets JS read it</text><circle cx="174" cy="400" r="11" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="174" y="405" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#38d996" text-anchor="middle" font-weight="700">4</text>
<rect x="40" y="440" width="900" height="82" rx="10" fill="#1a2235" stroke="#2f3a55" stroke-width="2"/>
<text x="60" y="470" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="400">The browser enforces CORS. curl and Postman ignore it, so CORS never protects the API itself.</text>
<text x="60" y="498" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#93a0b8" text-anchor="start" font-weight="400">No Allow-Origin in step 2 -&gt; the browser blocks the call and JS sees a CORS error.</text>
</svg>
