<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="CSRF attack">
<defs><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#93a0b8"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38d996"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6262"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b9cff"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffb547"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker></defs>
<rect width="980" height="540" rx="18" fill="#0f1420"/>
<text x="40" y="46" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#eef2f8" text-anchor="start" font-weight="700">CSRF: the browser attaches the cookie for the attacker</text>
<rect x="80" y="70" width="160" height="64" rx="10" fill="#1a2235" stroke="#5b9cff" stroke-width="2"/><text x="160.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">Browser</text><text x="160.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">logged in to the bank</text>
<rect x="420" y="70" width="160" height="64" rx="10" fill="#1a2235" stroke="#ff6262" stroke-width="2"/><text x="500.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">evil.example</text><text x="500.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">attacker's page</text>
<rect x="760" y="70" width="160" height="64" rx="10" fill="#1a2235" stroke="#38d996" stroke-width="2"/><text x="840.0" y="98" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#eef2f8" text-anchor="middle" font-weight="700">bank.example</text><text x="840.0" y="120" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#93a0b8" text-anchor="middle" font-weight="400">trusts the cookie</text>
<line x1="160" y1="134" x2="160" y2="520" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="500" y1="134" x2="500" y2="520" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="840" y1="134" x2="840" y2="520" stroke="#2f3a55" stroke-width="2" stroke-dasharray="4 6"/>
<line x1="160" y1="180" x2="500" y2="180" stroke="#93a0b8" stroke-width="2.5" marker-end="url(#am)"/><text x="330.0" y="171" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#eef2f8" text-anchor="middle" font-weight="400">visits the page</text><circle cx="144" cy="180" r="11" fill="#1a2235" stroke="#93a0b8" stroke-width="2"/><text x="144" y="185" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#eef2f8" text-anchor="middle" font-weight="700">1</text>
<line x1="500" y1="225" x2="160" y2="225" stroke="#ff6262" stroke-width="2.5" marker-end="url(#ar)"/><text x="330.0" y="216" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6262" text-anchor="middle" font-weight="400">hidden form + auto-submit</text><circle cx="144" cy="225" r="11" fill="#1a2235" stroke="#ff6262" stroke-width="2"/><text x="144" y="230" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ff6262" text-anchor="middle" font-weight="700">2</text>
<line x1="160" y1="275" x2="840" y2="275" stroke="#ff6262" stroke-width="2.5" marker-end="url(#ar)"/><text x="500.0" y="266" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#ff6262" text-anchor="middle" font-weight="400">POST /transfer   Cookie: SESSION=abc</text><circle cx="144" cy="275" r="11" fill="#1a2235" stroke="#ff6262" stroke-width="2"/><text x="144" y="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ff6262" text-anchor="middle" font-weight="700">3</text>
<text x="500" y="300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffb547" text-anchor="middle" font-weight="400">the browser adds the bank's cookie automatically</text>
<line x1="840" y1="345" x2="160" y2="345" stroke="#ff6262" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ar)"/><text x="500.0" y="336" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6262" text-anchor="middle" font-weight="400">200 OK: money moved</text><circle cx="144" cy="345" r="11" fill="#1a2235" stroke="#ff6262" stroke-width="2"/><text x="144" y="350" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#ff6262" text-anchor="middle" font-weight="700">4</text>
<rect x="40" y="390" width="900" height="120" rx="10" fill="#11221c" stroke="#38d996" stroke-width="2"/>
<text x="60" y="420" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#38d996" text-anchor="start" font-weight="700">The fix</text>
<text x="60" y="448" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="400">CSRF token: the bank requires a random token from its own pages on every POST.</text>
<text x="60" y="472" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#eef2f8" text-anchor="start" font-weight="400">evil.example cannot read the bank's pages, so the forged request has no token: 403.</text>
<text x="60" y="496" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#93a0b8" text-anchor="start" font-weight="400">Plus SameSite=Lax cookies, and an API using an Authorization header is not exposed.</text>
</svg>
