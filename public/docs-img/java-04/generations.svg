<text x="790" y="295" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="15" fill="#eef2f8" text-anchor="middle" font-weight="400">O0  age 15</text>
<path d="M440,330 C520,380 700,380 760,325" fill="none" stroke="#ffb547" stroke-width="2" marker-end="url(#ar)"/>
<text x="600" y="392" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#ffb547" text-anchor="middle" font-weight="400">promotion at MaxTenuringThreshold (default 15)</text>
<rect x="40" y="420" width="920" height="80" rx="10" fill="#16142a" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5"/>
<text x="56" y="448" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a78bfa" text-anchor="start" font-weight="700">metaspace (native memory, outside the heap)</text>
<text x="56" y="476" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#93a0b8" text-anchor="start" font-weight="400">class metadata, method bytecode, constant pool  -  replaced PermGen in Java 8</text>
</svg>
