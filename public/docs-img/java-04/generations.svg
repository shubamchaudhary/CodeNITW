<text x="385" y="267" font-family="JetBrains Mono, Consolas, Menlo, monospace" font-size="14" fill="#eef2f8" text-anchor="middle" font-weight="400">O3</text>
<text x="385" y="283" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#93a0b8" text-anchor="middle" font-weight="400">age 2</text>
