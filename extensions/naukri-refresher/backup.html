<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Naukri profile backup</title>
  <style>
    :root { --bg: #121212; --card: #1c1c1c; --line: #2a2a2a; --text: #ededed; --muted: #9a9a9a; --accent: #f97316; }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 14px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #111; font: 600 13px system-ui, sans-serif; cursor: pointer; }
    button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    pre { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 70vh; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <main>
    <h1>Naukri profile backup</h1>
    <p id="meta">Loading…</p>
    <div class="bar">
      <button id="download" type="button" disabled>Download JSON</button>
      <button id="delete" type="button" class="secondary" disabled>Delete backup</button>
    </div>
    <pre id="json"></pre>
  </main>
  <script type="module" src="backup.js"></script>
</body>
</html>
