name: Debug radar adapters

on:
  workflow_dispatch:
  push:
    branches:
      - claude/job-application-tracker-nqpn76
    paths:
      - scripts/debugAdapters.mjs

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/debugAdapters.mjs
