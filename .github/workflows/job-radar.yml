name: Job openings radar

on:
  schedule:
    # 13:30 UTC = 19:00 IST daily — end-of-day bucket
    - cron: "30 13 * * *"
  workflow_dispatch:
  push:
    branches:
      - claude/job-application-tracker-nqpn76
    paths:
      - scripts/jobRadar.mjs
      - .github/workflows/job-radar.yml

permissions:
  contents: write

# Never run two radars at once — a second run's push would race the first's.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run radar
        run: node scripts/jobRadar.mjs

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar/
          git diff --cached --quiet && exit 0
          git commit -m "Radar: update discovered openings"
          # If something landed on the branch mid-run, replay our commit on top
          # (radar files from this run win) and retry the push a few times.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          done
          git push
