name: Probe lead endpoints

on:
  workflow_dispatch:
  push:
    branches:
      - claude/job-application-tracker-nqpn76
    paths:
      - scripts/probeLeads.mjs
      - .github/workflows/probe-leads.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe lead endpoint variants
        run: node scripts/probeLeads.mjs
