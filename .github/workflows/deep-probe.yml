name: Deep board-discovery probe

on:
  workflow_dispatch:
  push:
    branches:
      - claude/job-application-tracker-nqpn76
    paths:
      - scripts/deepProbe.mjs
      - .github/workflows/deep-probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deep probe
        run: node scripts/deepProbe.mjs

      - name: Commit board map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/board-map.json
          git diff --cached --quiet && exit 0
          git commit -m "Add deep-probe board map"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
          done
          git push
