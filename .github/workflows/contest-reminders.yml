name: Contest reminders

# A BACKUP trigger for the site's reminder job. The main trigger is Vercel
# Cron (see vercel.json): GitHub's schedule is best-effort and can skip runs
# for hours. The job decides what is due (a day before and an hour before
# each LeetCode, Codeforces and CodeChef contest) and never emails anyone the
# same reminder twice, so extra or overlapping runs are harmless.
#
# Needs the repository secret CRON_SECRET (the same value as in Vercel).
# GitHub pauses scheduled workflows after 60 days without a commit to the
# repo; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Send a sample reminder to the site's own Gmail instead"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the reminder job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://interviewplanprep.vercel.app
          QUERY: ${{ inputs.test && '?test=1' || '' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::The CRON_SECRET repository secret isn't set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl -sS --fail-with-body --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/contest-reminders$QUERY"
